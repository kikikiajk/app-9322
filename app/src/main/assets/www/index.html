
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدير التركيز والعادات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        accent: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* تخصيصات التصميم الزجاجي والرسوم المتحركة */
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* حركة شريط التقدم الدائري */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* حركة ظهور وإخفاء المهام */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .task-enter {
            animation: slideIn 0.3s ease forwards;
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col justify-between selection:bg-primary-500 selection:text-white relative overflow-x-hidden">

    <!-- خلفيات جمالية متوهجة (Blobs) -->
    <div class="fixed top-[-10%] right-[-10%] w-72 h-72 bg-primary-500/20 dark:bg-primary-600/20 rounded-full blur-3xl pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] left-[-10%] w-80 h-80 bg-emerald-500/20 dark:bg-emerald-600/15 rounded-full blur-3xl pointer-events-none z-0"></div>

    <!-- الحاوية الرئيسية -->
    <div class="relative z-10 w-full max-w-md mx-auto px-4 pt-6 pb-8 flex-grow flex flex-col gap-6">
        
        <!-- الشريط العلوي (Header) -->
        <header class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-extrabold bg-gradient-to-l from-primary-600 to-indigo-400 dark:from-indigo-400 dark:to-emerald-400 bg-clip-text text-transparent">
                    مدير التركيز والعادات
                </h1>
                <p id="currentDate" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-medium"></p>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- عداد الجلسات المكتملة -->
                <div class="glass-card bg-white/70 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800/80 px-3 py-1.5 rounded-2xl flex items-center gap-1.5 shadow-sm" title="جلسات التركيز المكتملة اليوم">
                    <span class="text-amber-500 text-sm">🔥</span>
                    <span id="sessionCount" class="text-sm font-bold">0</span>
                </div>

                <!-- زر تبديل المظهر (ليلي / نهاري) -->
                <button id="themeToggle" aria-label="تبديل المظهر" class="glass-card bg-white/70 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800/80 p-2.5 rounded-2xl shadow-sm hover:scale-105 active:scale-95 transition-transform text-slate-600 dark:text-slate-300">
                    <!-- أيقونة الشمس (تظهر في الوضع الليلي) -->
                    <svg id="sunIcon" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <!-- أيقونة القمر (تظهر في الوضع النهاري) -->
                    <svg id="moonIcon" class="w-5 h-5 block dark:hidden text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- بطاقة مؤقت بومودورو (Pomodoro Timer Card) -->
        <section class="glass-card bg-white/80 dark:bg-slate-900/75 border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-6 shadow-xl shadow-slate-200/40 dark:shadow-none flex flex-col items-center">
            
            <!-- أزرار اختيار الوضع (تركيز / استراحة) -->
            <div class="flex bg-slate-100 dark:bg-slate-800/90 p-1 rounded-2xl w-full max-w-xs mb-6 border border-slate-200/50 dark:border-slate-700/50">
                <button id="focusModeBtn" onclick="switchMode('focus')" class="flex-1 py-2 text-sm font-bold rounded-xl transition-all bg-white dark:bg-slate-700 text-primary-600 dark:text-white shadow-sm">
                    وقت التركيز (25د)
                </button>
                <button id="breakModeBtn" onclick="switchMode('break')" class="flex-1 py-2 text-sm font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                    استراحة قصيرة (5د)
                </button>
            </div>

            <!-- المؤقت الدائري -->
            <div class="relative w-52 h-52 flex items-center justify-center mb-6">
                <svg class="w-full h-full" viewBox="0 0 120 120">
                    <!-- الحلقة الخلفية -->
                    <circle class="text-slate-200 dark:text-slate-800" stroke-width="7" stroke="currentColor" fill="transparent" r="52" cx="60" cy="60" />
                    <!-- حلقة التقدم المتحركة -->
                    <circle id="progressRing" class="progress-ring__circle text-primary-600 dark:text-indigo-500" stroke-width="7" stroke-linecap="round" stroke="currentColor" fill="transparent" r="52" cx="60" cy="60" />
                </svg>
                
                <!-- الوقت الرقمي والحالة -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <span id="timerDisplay" class="text-4xl font-extrabold tracking-wider font-mono text-slate-800 dark:text-white">25:00</span>
                    <span id="timerStatusText" class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">جاهز للانطلاق</span>
                </div>
            </div>

            <!-- أزرار التحكم بالمؤقت -->
            <div class="flex items-center gap-3 w-full justify-center">
                <button id="startPauseBtn" onclick="toggleTimer()" class="flex-1 max-w-[160px] py-3 px-6 rounded-2xl font-bold text-white bg-gradient-to-r from-primary-600 to-indigo-500 hover:from-primary-700 hover:to-indigo-600 shadow-lg shadow-primary-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <svg id="playIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                    <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    <span id="startPauseText">ابدأ التركيز</span>
                </button>

                <button onclick="resetTimer()" aria-label="إعادة ضبط المؤقت" class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all border border-slate-200/60 dark:border-slate-700/60" title="إعادة ضبط">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- قسم العادات والمهام اليومية -->
        <section class="glass-card bg-white/80 dark:bg-slate-900/75 border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-5 shadow-xl shadow-slate-200/40 dark:shadow-none flex-grow flex flex-col">
            
            <!-- رأس القسم وشريط التقدم -->
            <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <span>المهام والعادات اليومية</span>
                    </h2>
                    <span id="progressPercentage" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-400">
                        0% مكتمل
                    </span>
                </div>
                
                <!-- شريط التقدم الأفقي -->
                <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div id="dailyProgressBar" class="h-full bg-gradient-to-l from-emerald-500 to-teal-400 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- نموذج إضافة مهمة/عادة جديدة -->
            <form id="taskForm" class="flex gap-2 mb-4">
                <input type="text" id="taskInput" placeholder="أضف عادة أو مهمة جديدة..." required autocomplete="off"
                    class="flex-1 bg-slate-100/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
                
                <button type="submit" aria-label="إضافة" class="bg-primary-600 hover:bg-primary-700 text-white p-3 rounded-2xl shadow-md shadow-primary-500/20 active:scale-95 transition-all flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </form>

            <!-- قائمة المهام -->
            <ul id="taskList" class="space-y-2.5 overflow-y-auto max-h-[260px] pr-1">
                <!-- يتم توليد العناصر عبر JavaScript -->
            </ul>

            <!-- رسالة عند فراغ القائمة -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-8 text-center">
                <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">لا توجد مهام حالياً. ابدأ بإضافة هدفك الأول!</p>
            </div>
        </section>

    </div>

    <!-- تذييل الصفحة (Footer Attribution) -->
    <footer class="relative z-10 py-4 text-center">
        <p class="text-xs font-medium text-slate-400 dark:text-slate-500 tracking-wide">
            تطوير: كرار سلام الغراوي
        </p>
    </footer>

    <!-- إشعار منبثق (Toast Notification) بديل عن alert() -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="glass-card bg-slate-900/90 dark:bg-white/95 text-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-sm font-bold border border-slate-700/50 dark:border-slate-200">
            <span id="toastIcon">🎉</span>
            <span id="toastMessage">تم إنجاز الجلسة بنجاح!</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. إدارة الحالة والتخزين المحلي (State & Storage)
        // ==========================================
        const STORAGE_KEYS = {
            TASKS: 'focus_app_tasks_v1',
            SESSIONS: 'focus_app_sessions_v1',
            THEME: 'focus_app_theme_v1'
        };

        let tasks = [];
        let completedSessions = 0;

        // إعدادات المؤقت
        const MODES = {
            focus: { time: 25 * 60, label: 'وقت التركيز', colorClass: 'text-primary-600 dark:text-indigo-500' },
            break: { time: 5 * 60, label: 'استراحة قصيرة', colorClass: 'text-emerald-500 dark:text-emerald-400' }
        };

        let currentMode = 'focus';
        let timeLeft = MODES.focus.time;
        let timerInterval = null;
        let isRunning = false;

        // عناصر DOM
        const progressRing = document.getElementById('progressRing');
        const radius = progressRing.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = 0;

        // ==========================================
        // 2. التهيئة عند تحميل الصفحة (Initialization)
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            displayCurrentDate();
            loadData();
            updateTimerDisplay();
            renderTasks();
        });

        function displayCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('ar-IQ', options);
            document.getElementById('currentDate').textContent = today;
        }

        function loadData() {
            try {
                const savedTasks = localStorage.getItem(STORAGE_KEYS.TASKS);
                if (savedTasks) {
                    tasks = JSON.parse(savedTasks);
                } else {
                    // مهام افتراضية ترحيبية للمستخدم الجديد
                    tasks = [
                        { id: Date.now() + 1, text: 'إكمال جلسة تركيز عميق (25 دقيقة)', completed: false },
                        { id: Date.now() + 2, text: 'شرب 8 أكواب من الماء', completed: false },
                        { id: Date.now() + 3, text: 'قراءة 10 صفحات من كتاب مفيد', completed: false }
                    ];
                    saveTasks();
                }

                const savedSessions = localStorage.getItem(STORAGE_KEYS.SESSIONS);
                if (savedSessions) {
                    completedSessions = parseInt(savedSessions, 10) || 0;
                }
                document.getElementById('sessionCount').textContent = completedSessions;
            } catch (e) {
                console.error('خطأ في قراءة البيانات من التخزين المحلي:', e);
            }
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEYS.TASKS, JSON.stringify(tasks));
            } catch (e) {
                console.error('خطأ في حفظ المهام:', e);
            }
        }

        function saveSessions() {
            try {
                localStorage.setItem(STORAGE_KEYS.SESSIONS, completedSessions.toString());
                document.getElementById('sessionCount').textContent = completedSessions;
            } catch (e) {
                console.error('خطأ في حفظ الجلسات:', e);
            }
        }

        // ==========================================
        // 3. إدارة المظهر (Dark / Light Theme)
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
            const htmlEl = document.documentElement;
            
            if (savedTheme === 'light') {
                htmlEl.classList.remove('dark');
            } else {
                htmlEl.classList.add('dark'); // الوضع الليلي افتراضي لمظهر عصري
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const htmlEl = document.documentElement;
            htmlEl.classList.toggle('dark');
            const isDark = htmlEl.classList.contains('dark');
            localStorage.setItem(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
        });

        // ==========================================
        // 4. التنبيه الصوتي (Web Audio API)
        // ==========================================
        function playNotificationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                // نغمة لطيفة مكونة من نوتتين متتاليتين
                const playNote = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    gain.gain.setValueAtTime(0.01, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.25, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };

                const now = ctx.currentTime;
                playNote(587.33, now, 0.4);       // D5
                playNote(880.00, now + 0.25, 0.6); // A5
            } catch (e) {
                console.warn('تعذر تشغيل الصوت:', e);
            }
        }

        // ==========================================
        // 5. منطق مؤقت بومودورو (Pomodoro Logic)
        // ==========================================
        function switchMode(mode) {
            if (isRunning) {
                pauseTimer();
            }
            currentMode = mode;
            timeLeft = MODES[mode].time;

            // تحديث أزرار التبديل
            const focusBtn = document.getElementById('focusModeBtn');
            const breakBtn = document.getElementById('breakModeBtn');

            if (mode === 'focus') {
                focusBtn.className = 'flex-1 py-2 text-sm font-bold rounded-xl transition-all bg-white dark:bg-slate-700 text-primary-600 dark:text-white shadow-sm';
                breakBtn.className = 'flex-1 py-2 text-sm font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200';
                progressRing.classList.remove('text-emerald-500', 'dark:text-emerald-400');
                progressRing.classList.add('text-primary-600', 'dark:text-indigo-500');
                document.getElementById('startPauseText').textContent = 'ابدأ التركيز';
            } else {
                breakBtn.className = 'flex-1 py-2 text-sm font-bold rounded-xl transition-all bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-sm';
                focusBtn.className = 'flex-1 py-2 text-sm font-bold rounded-xl transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200';
                progressRing.classList.remove('text-primary-600', 'dark:text-indigo-500');
                progressRing.classList.add('text-emerald-500', 'dark:text-emerald-400');
                document.getElementById('startPauseText').textContent = 'ابدأ الاستراحة';
            }

            document.getElementById('timerStatusText').textContent = 'جاهز للانطلاق';
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            document.getElementById('playIcon').classList.add('hidden');
            document.getElementById('pauseIcon').classList.remove('hidden');
            document.getElementById('startPauseText').textContent = 'إيقاف مؤقت';
            document.getElementById('timerStatusText').textContent = currentMode === 'focus' ? 'قيد التركيز العميق...' : 'وقت الاسترخاء...';

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    completeTimerSession();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('playIcon').classList.remove('hidden');
            document.getElementById('pauseIcon').classList.add('hidden');
            document.getElementById('startPauseText').textContent = 'استئناف';
            document.getElementById('timerStatusText').textContent = 'متوقف مؤقتاً';
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = MODES[currentMode].time;
            document.getElementById('startPauseText').textContent = currentMode === 'focus' ? 'ابدأ التركيز' : 'ابدأ الاستراحة';
            document.getElementById('timerStatusText').textContent = 'جاهز للانطلاق';
            updateTimerDisplay();
        }

        function completeTimerSession() {
            pauseTimer();
            playNotificationSound();

            if (currentMode === 'focus') {
                completedSessions++;
                saveSessions();
                showToast('أحسنت! أتممت جلسة تركيز بنجاح 🔥', '🎉');
                switchMode('break');
            } else {
                showToast('انتهت الاستراحة! هل أنت مستعد لجلسة جديدة؟', '⚡');
                switchMode('focus');
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formatted = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = formatted;

            // تحديث الحلقة الدائرية
            const totalTime = MODES[currentMode].time;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        // ==========================================
        // 6. إدارة العادات والمهام (Tasks & Habits)
        // ==========================================
        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (text) {
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                tasks.unshift(newTask);
                saveTasks();
                renderTasks();
                input.value = '';
                showToast('تمت إضافة المهمة بنجاح', '✨');
            }
        });

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    const updated = !task.completed;
                    if (updated) {
                        playNotificationSound();
                    }
                    return { ...task, completed: updated };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-enter flex items-center justify-between p-3.5 rounded-2xl border transition-all duration-200 ${
                        task.completed 
                        ? 'bg-emerald-50/60 dark:bg-emerald-950/20 border-emerald-200/70 dark:border-emerald-900/40' 
                        : 'bg-slate-50/90 dark:bg-slate-800/60 border-slate-200/70 dark:border-slate-700/60 hover:border-primary-400/50'
                    }`;

                    li.innerHTML = `
                        <button onclick="toggleTask(${task.id})" class="flex items-center gap-3 flex-1 text-right focus:outline-none group">
                            <div class="w-6 h-6 rounded-xl flex items-center justify-center border-2 transition-all ${
                                task.completed 
                                ? 'bg-emerald-500 border-emerald-500 text-white scale-105' 
                                : 'border-slate-300 dark:border-slate-600 group-hover:border-primary-500'
                            }">
                                ${task.completed ? `
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                                    </svg>
                                ` : ''}
                            </div>
                            <span class="text-sm font-medium transition-all ${
                                task.completed 
                                ? 'line-through text-slate-400 dark:text-slate-500' 
                                : 'text-slate-700 dark:text-slate-200'
                            }">${escapeHTML(task.text)}</span>
                        </button>

                        <button onclick="deleteTask(${task.id})" aria-label="حذف المهمة" class="p-1.5 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors mr-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    listEl.appendChild(li);
                });
            }

            updateDailyProgress();
        }

        function updateDailyProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('dailyProgressBar').style.width = `${percentage}%`;
            document.getElementById('progressPercentage').textContent = `${percentage}% مكتمل`;
        }

        // حماية النصوص المدخلة من ثغرات XSS
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==========================================
        // 7. نظام الإشعارات السريعة (Toast System)
        // ==========================================
        let toastTimeout;
        function showToast(message, icon = '🔔') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').textContent = icon;

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3200);
        }
    </script>
</body>
</html>
